<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FleetTrack | Live Tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tracking">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <button class="btn ghost menu-btn">☰ Menu</button>
      <div class="crumb">Fleet management / Live tracking</div>
      <h1>Live tracking</h1>
      <div class="toolbar">
        <span class="muted">Simulated GPS: each active vehicle reports its position every 5 seconds. Campus speed limit: <b id="limit"></b> km/h.</span>
        <span class="spacer"></span>
        <label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="trail" checked style="width:auto"> Show route trail</label>
      </div>
      <div class="grid tracking">
        <div id="map"></div>
        <div class="card">
          <h2>Vehicles</h2>
          <p class="muted">Click a vehicle to follow it</p>
          <div id="vehicleList"></div>
          <div id="detail" style="margin-top:14px"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tracking.js"></script>
</body>
</html>
